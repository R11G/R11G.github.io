name: Update units data
on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update units.csv lang mod
        run: |
          python3 arbstats/units.py

      - name: Update custom lang mod
        run: |
          python3 arbstats/unitsUpdate.py

      - name: Update unitsClean.csv
        run: |
          python3 arbstats/unitsClean.py

      - name: Get latest commit message from upstream
        run: |
          set -e
          API_URL="https://api.github.com/repos/gszabi99/War-Thunder-Datamine/commits?per_page=1"
          MSG=$(curl -fsSL "$API_URL" | python3 -c "import sys,json; j=json.load(sys.stdin); print(j[0]['commit']['message'] if j else '')") || true
          if [ -z "${MSG}" ]; then
            echo "Auto-update unitsClean.csv" > /tmp/remote_commit_msg.txt
          else
            printf '%s' "$MSG" > /tmp/remote_commit_msg.txt
          fi

      - name: Commit & push if changed (use upstream message)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arbstats/lang/units.csv || true
          git add arbstats/unitsClean.csv || true
          git add arbstats/custom/units.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # Use the fetched upstream commit message (preserves newlines)
            git commit -F /tmp/remote_commit_msg.txt
            git push
          fi
