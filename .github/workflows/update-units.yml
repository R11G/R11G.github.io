name: Update units data
on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update units.csv lang mod
        run: |
          python3 arbstats/units.py

      - name: Update custom lang mod
        run: |
          python3 arbstats/unitsUpdate.py

      - name: Update unitsClean.csv
        run: |
          python3 arbstats/unitsClean.py

      - name: Get latest commit message from upstream
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/gszabi99/War-Thunder-Datamine/commits?per_page=1"

          if ! curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: github-actions" \
            "$API_URL" -o /tmp/upstream_commits.json; then
            echo "Auto-update unitsClean.csv" > /tmp/remote_commit_msg.txt
            exit 0
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          fallback = "Auto-update unitsClean.csv"
          path = Path("/tmp/upstream_commits.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              message = data[0]["commit"]["message"] if isinstance(data, list) and data and "commit" in data[0] else ""
          except Exception:
              message = ""

          Path("/tmp/remote_commit_msg.txt").write_text((message or fallback).strip(), encoding="utf-8")
          PY

      - name: Commit & push if changed (use upstream message)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WT Localization Files/Default Names/units.csv || true
          git add WT Localization Files/Jaek898 Default Roundels/units.csv || true
          git add WT Localization Files/Jaek898 Modified Roundels/units.csv || true
          git add arbstats/unitsClean.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # Use the fetched upstream commit message (preserves newlines)
            git commit -F /tmp/remote_commit_msg.txt
            git push
          fi
